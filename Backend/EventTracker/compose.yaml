services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: event_tracker_db
    environment:
      - 'POSTGRES_DB=event_tracker_db'
      - 'POSTGRES_PASSWORD=0na93rF6WB'
      - 'POSTGRES_USER=EventAdmin'
    ports:
      - '5250:5432'
    volumes:
      - pgdata_fresh:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U EventAdmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring_app:
    build: .
    container_name: event_tracker_app
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/event_tracker_db
      - SPRING_DATASOURCE_USERNAME=EventAdmin
      - SPRING_DATASOURCE_PASSWORD=0na93rF6WB
      # JPA
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=true
      # Server
      - SERVER_PORT=7022
      - SERVER_SERVLET_CONTEXT_PATH=/tracker/api
      # Security JWT
      - APPLICATION_SECURITY_JWT_SECRET_KEY=D4xN2pW9qY7sB0tL6vR1fZ8mE3hK5uJ2aC9rT4pV7dG
      - APPLICATION_SECURITY_JWT_EXPIRATION=86400000
      - APPLICATION_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION=604800000
      # Upload settings
      - APP_UPLOAD_DIR=uploads
      - APP_UPLOAD_MAX_SIZE=5242880
      - APP_UPLOAD_ALLOWED_TYPES=image/jpeg,image/png,image/webp
      # Admin user
      - APP_ADMIN_NAME=Admin
      - APP_ADMIN_EMAIL=admin@eventtracker.com
      - APP_ADMIN_PASSWORD=admin123
    ports:
      - '7022:7022'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

volumes:
  pgdata_fresh:

networks:
  app_network:
    driver: bridge